<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="manifest" href="manifest.json" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png" />
  <title>Weight Tracker</title>
  <meta name="theme-color" content="#0f1012" />
  <style>
    :root {
      --bg: #0f1012;
      --card: #18191c;
      --line: #26282c;
      --text: #ececee;
      --muted: #8b8e95;
      --accent: #5b8cff;
      --radius: 14px;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body, button, input, label, canvas {
      /* no double-tap zoom, pinch still works */
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: max(20px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
      -webkit-font-smoothing: antialiased;
    }
    .container {
      max-width: 560px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px;
    }

    /* header */
    .summary {
      padding: 8px 4px 4px;
    }
    .summary .label {
      font-size: 13px;
      color: var(--muted);
    }
    .summary .current {
      font-size: 44px;
      font-weight: 700;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
    }
    .summary .current small {
      font-size: 18px;
      font-weight: 500;
      color: var(--muted);
      margin-left: 4px;
    }
    .summary .delta {
      font-size: 14px;
      color: var(--muted);
      margin-top: 2px;
      min-height: 18px;
    }

    /* entry */
    .entry {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }
    input {
      min-width: 0;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      font: inherit;
      font-size: 16px; /* >=16px keeps iOS from zooming on focus */
      background: var(--bg);
      color: var(--text);
      color-scheme: dark;
    }
    input:focus {
      outline: none;
      border-color: var(--accent);
    }
    #weightInput {
      grid-column: 1 / -1;
      padding: 14px 16px;
      font-size: 26px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    #dateInput {
      width: 100%;
    }
    .primary {
      border: none;
      border-radius: 10px;
      padding: 0 22px;
      font: inherit;
      font-size: 16px;
      font-weight: 600;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    .primary:active {
      opacity: 0.8;
    }

    /* chart */
    .chart-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .legend {
      display: flex;
      gap: 12px;
      font-size: 12px;
      color: var(--muted);
    }
    .legend span::before {
      content: '';
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 5px;
      background: var(--accent);
      vertical-align: 0;
    }
    .legend .raw::before {
      opacity: 0.35;
    }
    .legend .trend::before {
      width: 12px;
      height: 3px;
      border-radius: 2px;
      vertical-align: 2px;
    }
    .ranges {
      display: flex;
      background: var(--bg);
      border-radius: 8px;
      padding: 2px;
    }
    .ranges button {
      border: none;
      background: none;
      color: var(--muted);
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      padding: 5px 9px;
      border-radius: 6px;
      cursor: pointer;
    }
    .ranges button.active {
      background: var(--line);
      color: var(--text);
    }
    .chart-wrap {
      position: relative;
      height: 240px;
    }
    .empty {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 14px;
    }

    /* recent entries */
    .recent-row {
      display: flex;
      align-items: center;
      border-top: 1px solid var(--line);
    }
    .recent-row:first-child {
      border-top: none;
    }
    .recent-row .edit {
      flex: 1;
      display: flex;
      justify-content: space-between;
      border: none;
      background: none;
      color: var(--text);
      font: inherit;
      font-size: 15px;
      padding: 11px 4px;
      text-align: left;
      cursor: pointer;
    }
    .recent-row .edit span:first-child {
      color: var(--muted);
    }
    .recent-row .edit span:last-child {
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .recent-row .del {
      border: none;
      background: none;
      color: var(--muted);
      font-size: 20px;
      line-height: 1;
      padding: 8px 4px 8px 16px;
      cursor: pointer;
    }
    .recent-row.selected .edit span {
      color: var(--accent);
    }

    /* averages */
    .section-title {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .averages {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px 8px;
    }
    .averages .k {
      font-size: 12px;
      color: var(--muted);
    }
    .averages .v {
      font-size: 17px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    /* footer actions */
    .actions {
      display: flex;
      justify-content: center;
      gap: 4px;
      margin-top: 4px;
    }
    .actions button, .actions label {
      border: none;
      background: none;
      color: var(--muted);
      font: inherit;
      font-size: 13px;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
    }
    .actions button:active, .actions label:active {
      background: var(--card);
    }
    .actions .danger {
      color: #d9645c;
    }
    .file-input {
      display: none;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="container">
    <div class="summary">
      <div class="label">Current weight</div>
      <div class="current" id="currentWeight">–</div>
      <div class="delta" id="delta"></div>
    </div>

    <div class="card entry">
      <input type="text" id="weightInput" inputmode="decimal" autocomplete="off" enterkeyhint="done" placeholder="kg" aria-label="Weight in kg" />
      <input type="date" id="dateInput" aria-label="Date" />
      <button class="primary" id="addWeightBtn">Add</button>
    </div>

    <div class="card">
      <div class="chart-head">
        <div class="legend"><span class="raw">Weigh-ins</span><span class="trend">7-day trend</span></div>
        <div class="ranges" id="ranges">
          <button data-range="30">1M</button>
          <button data-range="90">3M</button>
          <button data-range="365">1Y</button>
          <button data-range="all">All</button>
        </div>
      </div>
      <div class="chart-wrap">
        <canvas id="weightChart"></canvas>
        <div class="empty" id="emptyState">No entries yet</div>
      </div>
    </div>

    <div class="card" id="recentCard">
      <div class="section-title">Recent · tap to edit</div>
      <div id="recentList"></div>
    </div>

    <div class="card">
      <div class="section-title">Averages</div>
      <div class="averages" id="averageDisplay"></div>
    </div>

    <div class="actions">
      <label for="importFileInput">Import</label>
      <input type="file" id="importFileInput" class="file-input" accept=".csv" />
      <button id="exportCsvBtn">Export</button>
      <button id="resetAppBtn" class="danger">Reset</button>
    </div>
  </div>

  <script>
    let weightData = JSON.parse(localStorage.getItem('weightData') || '[]');
    let range = localStorage.getItem('weightRange') || '90';
    let chart;

    const DAY = 86400000;
    const ACCENT = '#5b8cff';

    function saveData() {
      localStorage.setItem('weightData', JSON.stringify(weightData));
    }

    // parse 'YYYY-MM-DD' as local midnight
    function toTime(date) {
      return new Date(date + 'T00:00:00').getTime();
    }

    function todayString() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function fmtDate(t, withYear) {
      return new Date(t).toLocaleDateString(undefined, withYear
        ? { day: 'numeric', month: 'short', year: 'numeric' }
        : { day: 'numeric', month: 'short' });
    }

    // average of all weigh-ins in the 7 days up to each entry
    function trendSeries() {
      return weightData.map((e, i) => {
        const t = toTime(e.date);
        let sum = 0, n = 0;
        for (let j = i; j >= 0 && toTime(weightData[j].date) > t - 7 * DAY; j--) {
          sum += weightData[j].weight;
          n++;
        }
        return { x: t, y: +(sum / n).toFixed(2) };
      });
    }

    function calcAverage(daysBack, specificStart = null, specificEnd = null) {
      let start, end;

      if (specificStart && specificEnd) {
        // Use specific calendar range
        start = specificStart;
        end = specificEnd;
      } else {
        // Use rolling days
        start = new Date();
        start.setDate(start.getDate() - daysBack);
        end = new Date();
      }

      const filtered = weightData.filter(entry => {
        const entryDate = new Date(toTime(entry.date));
        return entryDate >= start && entryDate <= end;
      });

      if (!filtered.length) return '–';
      const avg = filtered.reduce((sum, e) => sum + e.weight, 0) / filtered.length;
      return avg.toFixed(1);
    }

    function updateAverages() {
      const avgDisplay = document.getElementById('averageDisplay');
      const currentYear = new Date().getFullYear();

      // Define the calendar years
      const lastYearStart = new Date(currentYear - 1, 0, 1);
      const lastYearEnd = new Date(currentYear - 1, 11, 31, 23, 59, 59);

      const yearBeforeStart = new Date(currentYear - 2, 0, 1);
      const yearBeforeEnd = new Date(currentYear - 2, 11, 31, 23, 59, 59);

      avgDisplay.innerHTML = [
        ['4 weeks', calcAverage(28)],
        ['3 months', calcAverage(90)],
        ['6 months', calcAverage(180)],
        ['365 days', calcAverage(365)],
        [currentYear - 1, calcAverage(null, lastYearStart, lastYearEnd)],
        [currentYear - 2, calcAverage(null, yearBeforeStart, yearBeforeEnd)]
      ].map(([k, v]) => `<div><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');
    }

    function updateSummary() {
      const current = document.getElementById('currentWeight');
      const delta = document.getElementById('delta');
      if (!weightData.length) {
        current.textContent = '–';
        delta.textContent = '';
        return;
      }
      const last = weightData[weightData.length - 1];
      current.innerHTML = `${last.weight.toFixed(1)}<small>kg</small>`;

      // compare trend now vs. trend ~30 days earlier
      const trend = trendSeries();
      const now = trend[trend.length - 1];
      const earlier = [...trend].reverse().find(p => p.x <= now.x - 30 * DAY);
      let text = fmtDate(toTime(last.date), false);
      if (earlier) {
        const d = now.y - earlier.y;
        const sign = d > 0.05 ? '+' : d < -0.05 ? '−' : '±';
        text += ` · ${sign}${Math.abs(d).toFixed(1)} kg in 30 days`;
      }
      delta.textContent = text;
    }

    function trendGradient(context) {
      const { ctx, chartArea } = context.chart;
      if (!chartArea) return 'transparent';
      const g = ctx.createLinearGradient(0, chartArea.top, 0, chartArea.bottom);
      g.addColorStop(0, 'rgba(91, 140, 255, 0.25)');
      g.addColorStop(1, 'rgba(91, 140, 255, 0)');
      return g;
    }

    function updateChart() {
      document.querySelectorAll('#ranges button').forEach(b =>
        b.classList.toggle('active', b.dataset.range === range));
      document.getElementById('emptyState').style.display = weightData.length ? 'none' : 'flex';

      const ctx = document.getElementById('weightChart').getContext('2d');
      if (chart) chart.destroy();
      chart = null;
      if (!weightData.length) return;

      const today = toTime(todayString());
      const firstT = toTime(weightData[0].date);
      const minX = range === 'all' ? firstT : Math.max(firstT, today - range * DAY);
      const maxX = Math.max(today, toTime(weightData[weightData.length - 1].date));
      const spansYears = maxX - minX > 300 * DAY;

      const raw = weightData.map(e => ({ x: toTime(e.date), y: e.weight })).filter(p => p.x >= minX);
      // keep one trend point before the window so the line enters from the edge
      const fullTrend = trendSeries();
      const firstIdx = Math.max(0, fullTrend.findIndex(p => p.x >= minX) - 1);
      const trend = fullTrend.slice(firstIdx);

      const ys = raw.map(p => p.y);
      const pad = Math.max(0.5, (Math.max(...ys) - Math.min(...ys)) * 0.15);

      chart = new Chart(ctx, {
        type: 'line',
        data: {
          datasets: [{
            label: 'Weigh-in',
            data: raw,
            showLine: false,
            pointRadius: raw.length > 150 ? 1.5 : raw.length > 60 ? 2.5 : 3.5,
            pointHoverRadius: 5,
            pointBackgroundColor: 'rgba(91, 140, 255, 0.35)',
            pointBorderWidth: 0,
            order: 2
          }, {
            label: 'Trend',
            data: trend,
            borderColor: ACCENT,
            borderWidth: 2.5,
            backgroundColor: trendGradient,
            fill: 'start',
            pointRadius: 0,
            pointHoverRadius: 0,
            tension: 0.35,
            order: 1
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: { duration: 250 },
          interaction: { mode: 'nearest', axis: 'x', intersect: false },
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: '#26282c',
              titleColor: '#ececee',
              bodyColor: '#ececee',
              displayColors: false,
              padding: 10,
              filter: item => item.datasetIndex === 0,
              callbacks: {
                title: items => fmtDate(items[0].parsed.x, true),
                label: item => {
                  const t = fullTrend.find(p => p.x === item.parsed.x);
                  return [`${item.parsed.y.toFixed(1)} kg`, t ? `Trend ${t.y.toFixed(1)} kg` : ''];
                }
              }
            }
          },
          scales: {
            x: {
              type: 'linear',
              min: minX,
              max: maxX,
              afterBuildTicks: axis => {
                axis.ticks = [0, 1, 2, 3].map(i => ({ value: minX + (maxX - minX) * i / 3 }));
              },
              grid: { display: false },
              border: { display: false },
              ticks: {
                color: '#8b8e95',
                maxTicksLimit: 5,
                maxRotation: 0,
                callback: v => fmtDate(v, spansYears)
              }
            },
            y: {
              suggestedMin: Math.min(...ys) - pad,
              suggestedMax: Math.max(...ys) + pad,
              grid: { color: '#222428' },
              border: { display: false },
              ticks: {
                color: '#8b8e95',
                maxTicksLimit: 5,
                callback: v => v.toFixed(Number.isInteger(v) ? 0 : 1)
              }
            }
          }
        }
      });
    }

    // if the chosen date already has an entry, show it and switch to "Update"
    function syncEntryForm() {
      const date = document.getElementById('dateInput').value;
      const found = weightData.find(e => e.date === date);
      document.getElementById('weightInput').value = found ? String(found.weight) : '';
      document.getElementById('addWeightBtn').textContent = found ? 'Update' : 'Add';
      updateRecent();
    }

    function updateRecent() {
      const list = document.getElementById('recentList');
      const selected = document.getElementById('dateInput').value;
      document.getElementById('recentCard').style.display = weightData.length ? '' : 'none';
      list.innerHTML = weightData.slice(-5).reverse().map(e => `
        <div class="recent-row${e.date === selected ? ' selected' : ''}">
          <button class="edit" data-date="${e.date}">
            <span>${fmtDate(toTime(e.date), true)}</span><span>${e.weight.toFixed(1)} kg</span>
          </button>
          <button class="del" data-date="${e.date}" aria-label="Delete">×</button>
        </div>`).join('');
    }

    function editEntry(date) {
      document.getElementById('dateInput').value = date;
      syncEntryForm();
      const input = document.getElementById('weightInput');
      window.scrollTo({ top: 0, behavior: 'smooth' });
      input.focus();
      input.select();
    }

    function deleteEntry(date) {
      const entry = weightData.find(e => e.date === date);
      if (!entry || !confirm(`Delete ${entry.weight.toFixed(1)} kg on ${fmtDate(toTime(date), true)}?`)) return;
      weightData = weightData.filter(e => e.date !== date);
      saveData();
      refresh();
    }

    function refresh() {
      updateSummary();
      updateAverages();
      updateChart();
      syncEntryForm();
    }

    function addWeight() {
      const weight = parseFloat(document.getElementById('weightInput').value.replace(',', '.'));
      const date = document.getElementById('dateInput').value;
      if (isNaN(weight) || !date) return alert('Please enter valid weight and date');
      const existing = weightData.findIndex(e => e.date === date);
      if (existing >= 0) weightData[existing].weight = weight;
      else weightData.push({ date, weight });
      weightData.sort((a, b) => toTime(a.date) - toTime(b.date));
      saveData();
      refresh();
      document.getElementById('weightInput').blur();
    }

    function exportCSV() {
      if (!weightData.length) return alert('No data to export.');
      const csv = ["Date,Weight", ...weightData.map(e => `${e.date},${e.weight}`)].join("\n");
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "weight_data.csv";
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(link.href);
    }

    function resetApp() {
      if (confirm('Delete all data?')) {
        weightData = [];
        saveData();
        refresh();
      }
    }

    function importCSV(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (e) {
        const lines = e.target.result.split(/\r?\n/);
        const newData = [];
        for (let i = 1; i < lines.length; i++) {
          const [date, weight] = lines[i].split(',');
          if (/^\d{4}-\d{2}-\d{2}$/.test((date || '').trim()) && !isNaN(parseFloat(weight))) newData.push({ date: date.trim(), weight: parseFloat(weight) });
        }
        weightData = [...weightData, ...newData];
        weightData = weightData.reduce((acc, curr) => {
          const found = acc.find(i => i.date === curr.date);
          if (found) found.weight = curr.weight;
          else acc.push(curr);
          return acc;
        }, []);
        weightData.sort((a, b) => toTime(a.date) - toTime(b.date));
        saveData();
        refresh();
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('dateInput').value = todayString();
      document.getElementById('addWeightBtn').addEventListener('click', addWeight);
      // digits plus one decimal separator (comma or dot)
      document.getElementById('weightInput').addEventListener('input', e => {
        let v = e.target.value.replace(/[^0-9.,]/g, '');
        const i = v.search(/[.,]/);
        if (i >= 0) v = v.slice(0, i + 1) + v.slice(i + 1).replace(/[.,]/g, '');
        e.target.value = v;
      });
      document.getElementById('weightInput').addEventListener('keydown', e => {
        if (e.key === 'Enter') addWeight();
      });
      // select the existing value so typing replaces it
      document.getElementById('weightInput').addEventListener('focus', e => e.target.select());
      document.getElementById('dateInput').addEventListener('change', syncEntryForm);
      document.getElementById('recentList').addEventListener('click', e => {
        const btn = e.target.closest('button');
        if (!btn) return;
        if (btn.classList.contains('del')) deleteEntry(btn.dataset.date);
        else editEntry(btn.dataset.date);
      });
      document.getElementById('exportCsvBtn').addEventListener('click', exportCSV);
      document.getElementById('resetAppBtn').addEventListener('click', resetApp);
      document.getElementById('importFileInput').addEventListener('change', importCSV);
      document.getElementById('ranges').addEventListener('click', e => {
        if (!e.target.dataset.range) return;
        range = e.target.dataset.range;
        localStorage.setItem('weightRange', range);
        updateChart();
      });
      refresh();
    });

    // Register Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .catch(error => console.error('Service Worker registration failed:', error));
      });
    }
  </script>
</body>
</html>
